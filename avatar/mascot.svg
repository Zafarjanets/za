<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0" stop-color="#4A8FD6"/>
      <stop offset="0.6" stop-color="#2B5FA8"/>
      <stop offset="1" stop-color="#173A73"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE36A"/>
      <stop offset="1" stop-color="#FFC21A"/>
    </linearGradient>
    <radialGradient id="head" cx="45%" cy="35%" r="70%">
      <stop offset="0" stop-color="#FFEB8A"/>
      <stop offset="0.7" stop-color="#FFD43B"/>
      <stop offset="1" stop-color="#F2B705"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0A1A3A" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="lid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/><stop offset="1" stop-color="#C9D2E3" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <rect width="1080" height="1080" fill="url(#bg)"/>
  <!-- floating code bits -->
  <g font-family="'DejaVu Sans Mono', monospace" font-weight="700" fill="#ffffff" opacity="0.16">
    <text x="120" y="250" font-size="110">{ }</text>
    <text x="760" y="230" font-size="100">&lt;/&gt;</text>
    <text x="110" y="900" font-size="90">( )</text>
    <text x="820" y="880" font-size="90">#</text>
  </g>

  <g filter="url(#shadow)">
    <!-- neck rising from behind the laptop, with Python-blue bands -->
    <path id="neck" d="M560 1120 C 560 980 420 940 440 820 C 455 720 545 700 540 600"
          fill="none" stroke="url(#body)" stroke-width="180" stroke-linecap="round"/>
    <path d="M560 1120 C 560 980 420 940 440 820 C 455 720 545 700 540 600"
          fill="none" stroke="#E39E00" stroke-width="180" stroke-dasharray="30 90" stroke-dashoffset="40" opacity="0.85"/>
    <!-- head -->
    <ellipse cx="540" cy="430" rx="270" ry="225" fill="url(#head)"/>
  </g>
  <!-- cheeks -->
  <ellipse cx="370" cy="545" rx="44" ry="26" fill="#FF8A80" opacity="0.55"/>
  <ellipse cx="710" cy="545" rx="44" ry="26" fill="#FF8A80" opacity="0.55"/>

  <!-- eyes -->
  <g>
    <circle cx="440" cy="420" r="72" fill="#fff"/>
    <circle cx="640" cy="420" r="72" fill="#fff"/>
    <circle cx="452" cy="430" r="42" fill="#1B2440"/>
    <circle cx="652" cy="430" r="42" fill="#1B2440"/>
    <circle cx="468" cy="412" r="15" fill="#fff"/>
    <circle cx="668" cy="412" r="15" fill="#fff"/>
  </g>
  <!-- glasses -->
  <g fill="none" stroke="#1B2440" stroke-width="16">
    <circle cx="440" cy="420" r="92"/>
    <circle cx="640" cy="420" r="92"/>
    <path d="M532 410 Q 540 398 548 410"/>
    <path d="M348 405 L 290 385"/>
    <path d="M732 405 L 790 385"/>
  </g>
  <!-- smile + tongue -->
  <path d="M495 545 Q 540 595 585 545" fill="none" stroke="#1B2440" stroke-width="14" stroke-linecap="round"/>

  <!-- laptop (we see the back of the lid) -->
  <g filter="url(#shadow)">
    <rect x="250" y="760" width="580" height="340" rx="36" fill="#E9EDF5"/>
    <rect x="250" y="760" width="580" height="340" rx="36" fill="url(#lid)"/>
    <g transform="translate(540 905)" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="22">
      <path d="M-95 -45 L-55 0 L-95 45" stroke="#3776AB"/>
      <path d="M-30 -45 L10 0 L-30 45" stroke="#5A9FD4"/>
      <path d="M35 -45 L75 0 L35 45" stroke="#FFC21A"/>
    </g>
  </g>
</svg>
