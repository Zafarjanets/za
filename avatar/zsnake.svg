<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="70%">
      <stop offset="0" stop-color="#1A2B55"/><stop offset="1" stop-color="#090E1E"/>
    </radialGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6FB0EA"/><stop offset="1" stop-color="#2F6AA3"/>
    </linearGradient>
    <linearGradient id="yel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE873"/><stop offset="1" stop-color="#F5B800"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="45"/></filter>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <circle cx="420" cy="400" r="250" fill="#3776AB" opacity="0.5" filter="url(#glow)"/>
  <circle cx="660" cy="680" r="230" fill="#FFD43B" opacity="0.28" filter="url(#glow)"/>
  <!-- ring -->
  <circle cx="540" cy="540" r="430" fill="none" stroke="url(#blue)" stroke-width="10" opacity="0.5"/>
  <circle cx="540" cy="540" r="430" fill="none" stroke="url(#yel)" stroke-width="10" stroke-dasharray="680 2020" stroke-dashoffset="-1000" stroke-linecap="round"/>

  <g filter="url(#sh)" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- blue snake: head top-left, top bar, down the diagonal to the middle -->
    <path d="M330 330 L 720 330 Q 760 330 735 362 L 545 560" stroke="url(#blue)" stroke-width="130"/>
    <!-- yellow snake: from the middle down the diagonal, bottom bar, head bottom-right -->
    <path d="M535 520 L 345 718 Q 320 750 360 750 L 750 750" stroke="url(#yel)" stroke-width="130"/>
  </g>
  <!-- eyes -->
  <circle cx="330" cy="318" r="20" fill="#fff"/><circle cx="335" cy="320" r="9" fill="#10182F"/>
  <circle cx="750" cy="762" r="20" fill="#fff"/><circle cx="745" cy="760" r="9" fill="#10182F"/>
  <!-- tongues -->
  <path d="M265 330 L 225 330 M225 330 L 205 312 M225 330 L 205 348" stroke="#FF5A5F" stroke-width="10" stroke-linecap="round" fill="none"/>
  <path d="M815 750 L 855 750 M855 750 L 875 732 M855 750 L 875 768" stroke="#FF5A5F" stroke-width="10" stroke-linecap="round" fill="none"/>
</svg>
